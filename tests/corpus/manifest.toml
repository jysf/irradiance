# ─────────────────────────────────────────────────────────────────────────────
# STRUCTURE CONFIRMED ACROSS 4 FRAMES (2026-08-18)
#
# L1025901 (planning session), L1021223, L1026016, L1026192 — every structural
# tag identical: SubIFD Linear Raw / SamplesPerPixel 1 / 14-bit / Uncompressed,
# 8424x5632, single strip, StripByteCounts 83026944, levels 512/16383,
# ActiveArea 0 0 5632 8392, DefaultCrop 12 24 / 8368 5584, both opcode lists.
#
# What VARIES frame to frame: Orientation, and total FILE size
# (85,796,864 / 85,078,016 / 84,637,696) — while StripByteCounts is constant.
# The variation is entirely in the embedded previews, never in the sensor plane.
# A decoder must therefore locate the strip by offset, never by arithmetic on
# file length.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# WANTED — declared before the file exists, so the gap is visible rather than
# forgotten. A declared-empty row is fine; a forgotten one is the failure mode.
# (Same discipline as docs/conformance-matrix.md's `coverage` column.)
# ─────────────────────────────────────────────────────────────────────────────

