licence         = "CC0-1.0"
source          = "https://raw.pixls.us/ getfile.php/974 (submitted 2017-01-25)"
provenance      = "Public domain dedication. CC0 => the ONLY class of third-party file that could ever be promoted to tier A."
notes           = """
⭐ THE ONE THAT ACTUALLY DECODES TODAY. 16-bit, SamplesPerPixel 1, Linear Raw,
**Uncompressed**, 5216x3472, single strip (RowsPerStrip 3472 = full height).
Layer-0 arithmetic closes EXACTLY: 5216*3472*16/8 = 36,219,904 == StripByteCounts.

Why it is the most valuable third-party file we have:
  - a THIRD bit depth (16, vs the Q2M's 14) — the first real exercise of the
    unpacker's `bits` parameter, which has only ever run with 14
  - BlackLevel 220, not 512 — catches a hardcoded level
  - ActiveArea 2 2 5212 3468 — a NON-ZERO origin, where every Q2M frame is
    0 0 5632 8392. The ActiveArea crop has never actually moved anything.
  - NO OpcodeList tags at all — exercises the no-opcodes path
"""

  [file.oracle]
  raw_checksum  = "b0f602b90db91f981bbd6802fd0e6edf"   # dnglab 0.7.2
  strip_bytes   = 36219904

