# .repo-context.yaml
# Describes the APP (the repo itself). Persists across all projects run
# against this app. Forward-compatible with ContextCore's ProjectContext CRD.
#
# Projects (waves of work against this app) live in ./projects/<id>/ and
# each has its own brief.md.

apiVersion: contextcore.io/v2
kind: RepoContext

metadata:
  repo:
    id: irradiance
    name: "irradiance"
    purpose: "A permissively-licensed, pure-Rust library that reads camera RAW files and develops them into images — sensor data in, pixels and metadata out."
    url: "github.com/jysf/irradiance"

  business:
    criticality: medium               # critical | high | medium | low
    owner: jysf
    contacts:
      - "jyashinsky@gmail.com"

spec:
  stack:
    language: "rust"
    runtime: "native library (no async runtime, no I/O, no CLI); edition 2021, stable toolchain"
    framework: null
    database: null
    hosting: "crates.io (library); consumed by crustyimg via a raw-develop feature"

  # Agent + cost model config (DEC-005). Defaults reproduce the Claude-Code
  # workflow, so an existing instance changes nothing. A NON-Claude instance
  # edits these once to run the template on another agent — see docs/porting.md.
  agent:
    # Reconciled 2026-08-16 (DEC-000 follow-up 6) to the models actually in use.
    # The tier INTENT is unchanged — strong model for design/verify, cheaper one
    # for build — only the ids are now real. DEC-004 rule 3 depends on this being
    # accurate: a stale map is exactly the silent ~6x cost surprise the rule exists
    # to prevent, because the orchestrator stamps these into every handoff.
    # ⚠ 2026-08-21 (SPEC-007/FU-6): this map is 0 FOR 2 as a PREDICTION -- it said
    # sonnet when a build ran on opus, then opus when a build ran on sonnet. The
    # defect is the wiring, not the values: a prediction is stamped into
    # handoff.to_agent, which handback-sync copies into a field downstream reads
    # as a MEASUREMENT. Both times the only safeguard was an implementer who
    # noticed and said so.
    # TREAT THESE AS A DISPATCH HINT ONLY. `to_agent` should start null and the
    # handback should be its sole writer; until new-handoff is changed, whoever
    # runs a cycle must correct to_agent to what ACTUALLY ran.
    default_model: claude-opus-5      # stamped into new specs/patches' agents.*
    tier_map:                         # which model runs which cycle (pluggable)
      design: claude-opus-5
      # Corrected 2026-08-18 after SPEC-001's build ran on opus while this said
      # sonnet. handback-sync copies to_agent into the spec's cost session, so
      # the mismatch would have booked 15.4M Opus tokens against Sonnet — exactly
      # the silent cost surprise DEC-004 rule 3 exists to prevent. Build cycles
      # are dispatched to a CLI session here, not to a sonnet sub-agent, so the
      # map now says what actually runs.
      build: claude-opus-5
      verify: claude-opus-5
  cost:
    # How a real tokens_total is obtained. `just cost-audit` honors this:
    #   subagent_tokens | api_usage | manual  -> gate enforced (real number required)
    #   none                                   -> gate DISABLED (no token source here)
    metering_source: subagent_tokens
    rate_per_mtok: 6.60               # USD per 1M tokens for the estimate (DEC-002 basis)
    currency: USD

  # How THIS app versions its own releases (DEC-007). The release-spec (DEC-006)
  # cuts tags in this scheme; `just next-version` suggests the next one.
  #   calver    -> vYYYY.MM.PATCH (e.g. v2026.07.0) — date decides; ZERO judgment
  #   semver    -> vMAJOR.MINOR.PATCH — for a library/public API whose number
  #                must signal compatibility to consumers (you pick the bump)
  #   monotonic -> vN (v1, v2, …) — simplest; just increment
  # Default `calver` "just works"; switch only when a project genuinely needs it.
  # NB: the top-level VERSION file is TEMPLATE PROVENANCE (which template version
  # this repo was scaffolded from), NOT this app's version — the app version
  # lives in git tags (and/or your ecosystem file). See docs/versioning.md.
  version:
    scheme: semver
    # current: null                   # optional pin; else derived from git tags

  # Accomplishment logging at ship (DEC-010). ON by default: at ship, the agent
  # records the win WITH IMPACT (for retros/reviews/résumés) by calling the tool
  # below directly — the `brag` CLI (`brag add -i "<impact>"`) or its MCP server
  # (`brag mcp serve` → the brag_add tool). This is coaching, not a wrapper: the
  # agent runs the tool itself. Set enabled: false to opt out, or swap `tool`.
  # See guidance/recommended-tools.md for the fields + impact framing.
  accomplishments:
    enabled: true
    tool: brag                        # brag | none | <other cli>

  # Standard paths; do not change without also updating AGENTS.md.
  paths:
    agents_md: ./AGENTS.md
    docs: ./docs
    guidance: ./guidance
    decisions: ./decisions
    projects: ./projects
    templates: ./projects/_templates

  observability:
    sampling: null                    # Used if you adopt ContextCore.
    alert_routing: null
    runbook_base: null
