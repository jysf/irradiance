# cargo-deny — license policy enforcement.
#
# This crate is distributed under a permissive license, so the binary stays
# widely embeddable, including in closed-source/commercial products. To keep that
# promise, every dependency must carry a permissive (or an explicitly excepted)
# license. Any GPL/AGPL — or any license not in `allow` and not excepted — fails
# `cargo deny check licenses` (and the CI `licenses` job). Run locally: `just deny`.
#
# Worked example transcribed from docs/license-policy.md; kept in sync with the
# constraint `no-copyleft-dependencies` (guidance/constraints.yaml). SPEC-001
# ships this with zero dependencies declared in Cargo.toml — the gate exists so
# the FIRST dependency this crate ever adds is checked automatically, not so it
# is checking anything today.
#
# ⚠ ONE FILE, TWO GRAPHS. cargo-deny evaluates the graph rooted at ONE manifest,
# and this repo has two: the library at the root, and `irradiance-fuzz` under
# `fuzz/` (DEC-011). This policy file governs both, but only because BOTH are
# invoked:
#
#     just deny        ->  cargo deny check licenses
#     just deny-fuzz   ->  cargo deny --manifest-path fuzz/Cargo.toml check licenses
#
# `just deny` alone does NOT see `fuzz/`. DEC-011 originally recorded that as an
# unreachable corner of the gate and hand-checked it instead; SPEC-003's verify
# cycle measured that the second invocation works and that the hand-check had got
# the licences wrong (HANDOFF-012, SB-1). Adding a dependency to `fuzz/` and
# running only `just deny` is therefore a green that checked nothing. Run both.

[graph]
# Evaluate the FULL feature graph so a copyleft dependency cannot slip in behind
# an off-by-default feature flag unnoticed.
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]

# Per-crate exceptions: a license OUTSIDE `allow`, knowingly accepted for ONE
# named crate. Everything else still fails — including any NEW GPL/AGPL/LGPL dep.
# Document why each exception is safe.
exceptions = [
    # libfuzzer-sys declares `(MIT OR Apache-2.0) AND NCSA` — AND, conjunctive:
    # the NCSA terms apply IN ADDITION to the permissive pair, not as an
    # alternative to them. NCSA is there because the crate vendors LLVM's own
    # libFuzzer runtime (`libfuzzer/` in its source tree), which is NCSA-licensed
    # C++ compiled by its build script.
    #
    # NCSA is OSI-approved and FSF Free/Libre — cargo-deny itself reports both —
    # and it is permissive: attribution and no-endorsement, no reciprocity. So it
    # satisfies `no-copyleft-dependencies` on substance. It is recorded here as a
    # per-crate EXCEPTION rather than added to `allow` above deliberately:
    #
    #   - `allow` is a standing, graph-wide sanction. NCSA is in this repo for
    #     exactly one reason (a fuzz-only test dependency's vendored C++), and it
    #     has no business being pre-approved for the LIBRARY's graph, which is
    #     the graph carrying the embeddable-permissive promise consumers rely on.
    #   - An exception is NAMED. A second crate arriving with NCSA fails loudly
    #     and gets its own decision, which is the behaviour this repo wants; a
    #     widened `allow` would wave it through silently.
    #
    # Reached only by `just deny-fuzz` — libfuzzer-sys is not in the library's
    # graph at all (DEC-011). Recorded there in full.
    { name = "libfuzzer-sys", allow = ["NCSA"] },
]

# Require high confidence when matching a license file's text to an SPDX id.
confidence-threshold = 0.9

# Evaluate DEV-dependencies too (SPEC-055, DEC-048). The constraint
# `no-copyleft-dependencies` covers dev-dependencies, but cargo-deny's licence
# check has skipped them by default since its PR#557 (documented opt-in:
# `licenses.include-dev`; still the default in 0.19.9 and 0.20.2, the version
# cargo-deny-action@v2 runs). Without it `cargo deny check licenses`
# GATHERS the whole graph (48 crates for the root, incl. `toml` and
# `ssimulacra2`) and then evaluates the licences of only one of them,
# `irradiance` itself. A GPL dev-dependency passed. The knob lives here under
# `[licenses]`, NOT under `[graph]`: `exclude-dev = false` there and an empty
# `[workspace]` in Cargo.toml were both probed and changed nothing.
#
# Build-dependencies are already evaluated by default (`cc` under libfuzzer-sys
# in the fuzz graph shows up without `include-build`), so only dev needs this.
#
# Load-bearing, and proven so: scripts/deny-red-proof.sh (`just deny-red-proof`)
# injects a GPL dev-dependency into a temp copy of BOTH graphs and asserts the
# gate goes red, and that it does NOT go red with this line removed. Delete it
# and that red-proof fails. Note `cargo deny list` ignores this knob and still
# prints one crate; read the `check licenses` output, not `list`.
include-dev = true
