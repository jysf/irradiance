# guidance/signals.yaml
# The Signals registry — ONE typed ledger for EVERY kind of feedback, so
# nothing rots un-decided. Coding lessons already had a forcing function
# (reflect at ship → codify into AGENTS.md). This gives the SAME teeth to
# process/tooling feedback, product/usage signals, and risks. See docs/signals.md.
#
# Every signal MUST have:
#   - id:             stable kebab-case identifier
#   - type:           lesson | process-debt | product | risk | golden-path
#   - summary:        one sentence
#   - evidence:       the specs/usage that raised it; for lessons, the N-count
#   - bar:            lessons only — 'N=3 same-outcome' | 'N=2 paired-opposing'
#                     (the codification bar); null for non-lessons
#   - status:         open | watch | accepted | rejected | codified | done | dropped
#   - disposition_at: stage-close | project-close   (which close owns the decision)
#   - first_flagged:  YYYY-MM-DD
#   - last_touched:   YYYY-MM-DD   (bump every time a close walks it — no silent carry)
#   - raised_by:      human | claude | <agent-id>
#   - notes:          optional — where it landed / defer-trigger / reject-reason
#
# Type → who dispositions it, and the terminal states it can reach:
#   lesson       → STAGE close.   open → watch (accumulating N) → codified | dropped.
#                  Graduates to `codified` ONLY once evidence meets the `bar`
#                  (N=3 same-outcome, or N=2 paired-opposing). This IS the WATCH
#                  ledger — promoted from prose-scattered-in-stage-files to one
#                  visible file, which is the cross-stage-visibility fix.
#   process-debt → PROJECT close. open → accepted (scheduled) | rejected | done | dropped.
#   product      → PROJECT close. a usage/dogfooding signal; feeds the NEXT project's framing.
#   risk         → revisited at each close; no auto-action (watch indefinitely).
#   golden-path  → PROJECT close. open → watch → codified | dropped, same as a lesson.
#                  The ONLY type that records something that WORKED. Every other
#                  type here is a problem, which meant "this approach worked so
#                  well another project should copy it wholesale" had nowhere to
#                  live and was lost at every close.
#                  THE BAR IS HARDER HERE, NOT SOFTER: a wrong paved road is worse
#                  than no road, because people follow it. Capture candidates
#                  freely; promote almost none. N=3 or it stays a preference.
#
# The ritual (FIRST_SESSION_PROMPTS.md Prompt 1d / 1e): at each close, walk every
# open/watch signal that close owns; each gets accept-and-schedule /
# reject-with-reason / defer-with-trigger, and `last_touched` bumped. NO silent carry.
#
# Browse with `just dash signals` (open count surfaces in `just dash`'s flags).
#
# The template's five illustrative seed entries (all citing `bragfile` and
# SPEC-026/028/029 — a DIFFERENT project) were deleted 2026-08-18. They were
# scaffold examples, not this repo's signals, and `just status`/`just dash`
# counted them as though they were ours. Same class as the seeded example DEC and
# the app-shaped constraints; see feedback/2026-08-15-irradiance-scaffold.md.
#
# What follows is irradiance's own ledger, and it starts from what this repo has
# actually generated.

signals:
  # --- golden-path: the ONE type that records something that WORKED ----------
  - id: pre-register-the-tolerance
    type: golden-path
    summary: "State a numeric acceptance threshold — and its falsifier — in writing BEFORE measuring anything."
    evidence: "SPIKE-001 Q5: >=85 and 'a missing warp must land far below 85' were both written down before the first score was computed; both survived. N=1."
    bar: "N=3"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Capture, do NOT promote — signals.yaml's own rule is that a wrong paved road
      is worse than no road, and this is N=1. What made it work: the falsifier was
      registered alongside the threshold, so the metric had to prove it could FAIL
      before it was allowed to certify anything. Watch for N=2 in STAGE-003.

  # --- lesson: planning docs written without running the code -----------------
  - id: unrun-docs-carry-errors
    type: lesson
    summary: "Docs written by a session that could not execute the code contain errors that only running finds."
    evidence: "N=2 — oracle-contract.md called `--srgb` a TIFF (it is a malformed PNM); measured-q2m-dng.md listed Orientation as a camera constant (it is per-frame)."
    bar: "N=3 same-outcome"
    status: watch
    disposition_at: stage-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Both errors were load-bearing: the first breaks STAGE-003's develop oracle,
      the second makes any orientation test pass on one frame and fail on the next.
      Neither was careless — both were reasonable inferences from documentation.
      At N=3, codify: a planning doc's claims get a `verified:` / `inferred:` marker
      so a later session knows which ones have been executed.

  # --- risk: the CI gap DEC-003 knowingly accepted ----------------------------
  - id: ci-cannot-prove-bit-exactness
    type: risk
    summary: "CI cannot run tier-B tests, so a green badge does not mean the decoder is correct."
    evidence: "DEC-003 — real camera files are never committed, so the bit-exact oracle runs only on a machine holding the corpus."
    bar: null
    status: watch
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Accepted deliberately, not overlooked — the alternative was unlicensed
      redistribution. Revisit at each close: has a real regression reached main
      because CI could not see it? If yes, the fix is a self-hosted or scheduled
      runner with the corpus mounted, NOT committing files.

  # --- process-debt: two metered cycles produced non-comparable numbers -------
  - id: token-counts-not-comparable
    type: process-debt
    summary: "Cost figures from different execution modes are not comparable, but `just calibration` averages them anyway."
    evidence: "SPEC-001 — build reported 197,940 (Agent-result subagent_tokens, unknown cache composition); verify reported 5,242,951 (summed from its own transcript, ~97% cache-read). A 26x spread that says nothing about effort."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Raised by the SPEC-001 reviewer, who flagged it about its OWN number rather
      than quietly filing it — the right instinct. cost.sessions has an
      `interface:` field but nothing records cache composition or how the figure
      was obtained, so a cache-heavy session and a cold one are indistinguishable
      downstream. `just calibration` will average them into a meaningless band the
      moment two specs have shipped.
      Options at project close: record a `basis:` per session
      (agent-result | transcript-sum | slash-cost) and have calibration group by
      it; or narrow calibration to a single interface; or state plainly that the
      numbers are spend-tracking, not effort-estimation, and stop pretending
      otherwise. Decide before enough specs ship to make the band look credible.
