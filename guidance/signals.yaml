# guidance/signals.yaml
# The Signals registry — ONE typed ledger for EVERY kind of feedback, so
# nothing rots un-decided. Coding lessons already had a forcing function
# (reflect at ship → codify into AGENTS.md). This gives the SAME teeth to
# process/tooling feedback, product/usage signals, and risks. See docs/signals.md.
#
# Every signal MUST have:
#   - id:             stable kebab-case identifier
#   - type:           lesson | process-debt | product | risk | golden-path
#   - summary:        one sentence
#   - evidence:       the specs/usage that raised it; for lessons, the N-count
#   - bar:            lessons only — 'N=3 same-outcome' | 'N=2 paired-opposing'
#                     (the codification bar); null for non-lessons
#   - status:         open | watch | accepted | rejected | codified | done | dropped
#   - disposition_at: stage-close | project-close   (which close owns the decision)
#   - first_flagged:  YYYY-MM-DD
#   - last_touched:   YYYY-MM-DD   (bump every time a close walks it — no silent carry)
#   - raised_by:      human | claude | <agent-id>
#   - notes:          optional — where it landed / defer-trigger / reject-reason
#
# Type → who dispositions it, and the terminal states it can reach:
#   lesson       → STAGE close.   open → watch (accumulating N) → codified | dropped.
#                  Graduates to `codified` ONLY once evidence meets the `bar`
#                  (N=3 same-outcome, or N=2 paired-opposing). This IS the WATCH
#                  ledger — promoted from prose-scattered-in-stage-files to one
#                  visible file, which is the cross-stage-visibility fix.
#   process-debt → PROJECT close. open → accepted (scheduled) | rejected | done | dropped.
#   product      → PROJECT close. a usage/dogfooding signal; feeds the NEXT project's framing.
#   risk         → revisited at each close; no auto-action (watch indefinitely).
#   golden-path  → PROJECT close. open → watch → codified | dropped, same as a lesson.
#                  The ONLY type that records something that WORKED. Every other
#                  type here is a problem, which meant "this approach worked so
#                  well another project should copy it wholesale" had nowhere to
#                  live and was lost at every close.
#                  THE BAR IS HARDER HERE, NOT SOFTER: a wrong paved road is worse
#                  than no road, because people follow it. Capture candidates
#                  freely; promote almost none. N=3 or it stays a preference.
#
# The ritual (FIRST_SESSION_PROMPTS.md Prompt 1d / 1e): at each close, walk every
# open/watch signal that close owns; each gets accept-and-schedule /
# reject-with-reason / defer-with-trigger, and `last_touched` bumped. NO silent carry.
#
# Browse with `just dash signals` (open count surfaces in `just dash`'s flags).
#
# The template's five illustrative seed entries (all citing `bragfile` and
# SPEC-026/028/029 — a DIFFERENT project) were deleted 2026-08-18. They were
# scaffold examples, not this repo's signals, and `just status`/`just dash`
# counted them as though they were ours. Same class as the seeded example DEC and
# the app-shaped constraints; see feedback/2026-08-15-irradiance-scaffold.md.
#
# What follows is irradiance's own ledger, and it starts from what this repo has
# actually generated.

signals:
  # --- golden-path: the ONE type that records something that WORKED ----------
  - id: pre-register-the-tolerance
    type: golden-path
    summary: "State a numeric acceptance threshold — and its falsifier — in writing BEFORE measuring anything."
    evidence: "SPIKE-001 Q5: >=85 and 'a missing warp must land far below 85' were both written down before the first score was computed; both survived. N=1."
    bar: "N=3"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Capture, do NOT promote — signals.yaml's own rule is that a wrong paved road
      is worse than no road, and this is N=1. What made it work: the falsifier was
      registered alongside the threshold, so the metric had to prove it could FAIL
      before it was allowed to certify anything. Watch for N=2 in STAGE-003.

  # --- lesson: planning docs written without running the code -----------------
  - id: unrun-docs-carry-errors
    type: lesson
    summary: "Docs written by a session that could not execute the code contain errors that only running finds."
    evidence: "N=2 — oracle-contract.md called `--srgb` a TIFF (it is a malformed PNM); measured-q2m-dng.md listed Orientation as a camera constant (it is per-frame)."
    bar: "N=3 same-outcome"
    status: watch
    disposition_at: stage-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ══ STAGE-001 CLOSE, 2026-08-22: DEFERRED with a trigger, still N=2. ══
      Below its N=3 bar and NOT codified — the bar did its job here, so let it.
      No third instance appeared across SPEC-005/007/008 or PATCH-001, and the
      practice that would have caused one (writing a doc from a session that
      cannot run the code) has largely stopped: SPEC-005's design cycle probed
      seven real files before a line of the spec was written, which is the
      opposite behaviour.
      TRIGGER: re-examine at STAGE-002's close, or the first time a planning doc
      states a numeric fact the author did not execute. If STAGE-002 closes with
      it still at N=2, DROP it — a lesson that stops recurring has been learned,
      and carrying it forever is the ledger rotting in the other direction.

      Both errors were load-bearing: the first breaks STAGE-003's develop oracle,
      the second makes any orientation test pass on one frame and fail on the next.
      Neither was careless — both were reasonable inferences from documentation.
      At N=3, codify: a planning doc's claims get a `verified:` / `inferred:` marker
      so a later session knows which ones have been executed.

  # --- risk: the CI gap DEC-003 knowingly accepted ----------------------------
  - id: ci-cannot-prove-bit-exactness
    type: risk
    summary: "CI cannot run tier-B tests, so a green badge does not mean the decoder is correct."
    evidence: "DEC-003 — real camera files are never committed, so the bit-exact oracle runs only on a machine holding the corpus."
    bar: null
    status: watch
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      Accepted deliberately, not overlooked — the alternative was unlicensed
      redistribution. Revisit at each close: has a real regression reached main
      because CI could not see it? If yes, the fix is a self-hosted or scheduled
      runner with the corpus mounted, NOT committing files.

  # --- process-debt: two metered cycles produced non-comparable numbers -------
  - id: token-counts-not-comparable
    type: process-debt
    summary: "Cost figures from different execution modes are not comparable, but `just calibration` averages them anyway."
    evidence: "SPEC-001 — build reported 197,940 (Agent-result subagent_tokens, unknown cache composition); verify reported 5,242,951 (summed from its own transcript, ~97% cache-read). A 26x spread that says nothing about effort."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-20
    raised_by: claude
    notes: |
      ⚠ MEASURED 2026-08-20 (SPEC-002 build), and it is worse than "not
      comparable" — the transcript-sum figures are WRONG, roughly 1.7x too high.
      A Claude Code transcript writes ONE jsonl line PER CONTENT BLOCK, and every
      line of a multi-block assistant message repeats the SAME `usage` object.
      Summing usage objects therefore double-counts most messages. Measured on
      SPEC-001's own verify-4 transcript (e17489a8): 116 raw usage objects but
      only 67 distinct `message.id`s, 47 of them duplicated —
        raw sum      14,177,812
        deduped sum   8,053,949
      and that session RECORDED 10,962,512 (a partial raw sum, taken before the
      session ended). Every transcript-sum figure in SPEC-001's cost.sessions is
      inflated the same way, so cost.totals 51,979,929 is not a real number.
      The fix is one line in the summing loop: key by `message.id` and keep one
      usage object per id. SPEC-002's build session reports a DEDUPED figure and
      says so, which means it is not comparable to ANY SPEC-001 session — the
      spread is now a method artifact on top of an execution-mode artifact.
      Whoever dispositions this should re-sum SPEC-001's four transcript-based
      sessions with dedup rather than leaving the recorded numbers standing.

      Raised by the SPEC-001 reviewer, who flagged it about its OWN number rather
      than quietly filing it — the right instinct. cost.sessions has an
      `interface:` field but nothing records cache composition or how the figure
      was obtained, so a cache-heavy session and a cold one are indistinguishable
      downstream. `just calibration` will average them into a meaningless band the
      moment two specs have shipped.
      Options at project close: record a `basis:` per session
      (agent-result | transcript-sum | slash-cost) and have calibration group by
      it; or narrow calibration to a single interface; or state plainly that the
      numbers are spend-tracking, not effort-estimation, and stop pretending
      otherwise. Decide before enough specs ship to make the band look credible.

  # --- lesson: at its bar already, on a single spec ---------------------------
  - id: attribute-text-inside-doc-comments
    type: lesson
    summary: "Tooling that pattern-matches Rust attributes must exclude doc comments and plain // comments — three separate false results on one spec."
    evidence: "SPEC-001, N=5 (see notes) — (1) orchestrator's attack hit `#[cfg(test)]` inside a doc comment; (2) orchestrator's attack hit the second `#![deny(` which lives in the module doc, deleting 14 chars of prose and reporting a false negative; (3) the red-proof's own prologue parser skips `//!` but not `//`, which is PL-1: a silent false green with a panic shipped."
    bar: "N=3 same-outcome"
    status: codified
    disposition_at: stage-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ══ STAGE-001 CLOSE, 2026-08-22: CODIFIED at N=5. ══
      Landed in AGENTS.md §16 alongside its sibling
      [[a-gate-that-fails-mutely-is-a-gate-that-never-ran]] — they are one rule
      stated from two sides (a match landing on the wrong text; a NON-match
      becoming control flow), and splitting them in the codification would
      guarantee each is rediscovered through the other's gap.

      N=5 as of SPEC-001 ship (F-6 corrected the recorded N=3 — verify round 3 hit
      it again on `#[cfg(test)]` in the module doc at src/lib.rs:16, and the
      orchestrator's stale hazard example in HANDOFF-006 was a sixth near-miss).
      WELL PAST BAR on one spec, and every instance produced a WRONG ANSWER rather
      than an error — twice a false negative, once a false green that shipped a
      panic past seven gates. Both the reviewer and the orchestrator walked into it.
      Codify at stage close: any tooling that greps for Rust attributes must
      anchor to column 0 AND exclude `//`/`//!`/`/* */`, and must assert its
      match count rather than taking the first hit. The general form is the one
      worth writing down: `index()` on source text finds documentation about the
      code as readily as the code.

  # --- process-debt: a live hole the red-proof structurally cannot close ------
  - id: allow-attribute-exits-the-panic-policy
    type: process-debt
    summary: "One #[allow(clippy::panic, clippy::expect_used)] on a pub fn passes all seven gates while shipping panics on the public API."
    evidence: "SPEC-001 verify round 3, F-2 — reproduced independently by the orchestrator: no module needed, seven green gates, two panics on the public API."
    bar: null
    status: done
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-18
    raised_by: claude
    notes: |
      CLOSED by SPEC-006 (shipped 2026-08-18): `cargo clippy --lib -- -F <each lint>`.
      Verified under FOURTEEN bypass attempts incl. #[cfg_attr], #[expect], lint
      aliases, macro-generated allows, and a lib module pulled in by #[path] from
      tests/. The grep-shaped mechanism this signal originally predicted was
      REJECTED — a compiler-level forbid needs no text matching at all, which is
      most of why it won.
      Residual, recorded but NOT converted to a spec: the gate's own -F flags are
      unpinned (swap -F->-D and the hole returns with eight green gates). That
      requires editing the gate's definition in ci.yml/app.just, which is visible
      in any diff — a weaker threat than a one-line #[allow] on a pub fn. Where
      this recursion stops is a maintainer call at project close.
      ORIGINAL NOTE FOLLOWS.
      ACCEPTED AND SCHEDULED, not merely noted. DEC-009's red-proof pins the
      policy at the crate ROOT; no #![deny] mutation test can observe an #[allow]
      anywhere below it, so this needs a different mechanism (most likely a gate
      on `allow(` outside #[cfg(test)] and src/bin/ — which must heed
      [[attribute-text-inside-doc-comments]], now at N=5).
      The orchestrator originally attached this to SPEC-003 believing it went live
      with the first module. Wrong twice: it is live TODAY with no module at all,
      and the first module lands in SPEC-002. Re-attached to SPEC-002 at ship.
      constraints.yaml:33 currently reads as a stronger guarantee than holds (F-4)
      and should be softened in the same change.

  # --- lesson: a measurement licenses a claim about WHAT WAS MEASURED ---------
  - id: measurement-over-generalised
    type: lesson
    summary: "Running something proves what you ran, not the category it belongs to — over-generalised measurements read as `measured` and are wrong."
    evidence: "N=5. (1) SPEC-002/F2 — measured eprintln! is captured, asserted 'loudness cannot live in the harness' (false; writeln!(stderr) escapes). (2) SPEC-004 — read the first lines of `pub struct Sensor` and asserted SPEC-003 'stops where geometry begins' (false; it already carried every tag). (3) SPEC-007 — mutated ONE structural tag, watched the test go red, asserted 'the boundary test has teeth'; the reviewer softened the other four and all 58 tests stayed green. (4) SPEC-005 build — DEC-013 recorded choosing a GENERIC malformed_tags exemption and shipped a single hardcoded tag; settled by test, not by reading (malformed BlackLevelRepeatDim diffs []; an identically malformed ActiveArea still reds). (5) SPEC-005/FU-8 — the ORCHESTRATOR, in the doc comment written to reject instance 4 for exactly this, measured ONE simulated future and wrote 'the day FU-1 is fixed, K3III.DNG goes red here'; the reviewer built FU-1 AS SPECIFIED and the alarm never fires."
    bar: "N=3 same-outcome"
    status: codified
    disposition_at: stage-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ══ STAGE-001 CLOSE, 2026-08-22: CODIFIED at N=5. ══
      Landed in AGENTS.md §16 as a WRITING RULE, which is the form instance 5
      dictated: it was committed by an agent who knew the rule, had just enforced
      it on someone else, and was writing the correction at the time. A checklist
      cannot catch that; a rule you apply while typing the sentence can.

      ⚠ N=5 as of 2026-08-22 (SPEC-005), and instance 5 is the one that settles
      how to codify this. It was committed BY THE ORCHESTRATOR, in the doc
      comment written to reject instance 4 FOR THIS EXACT DEFECT, in the same
      commit. Knowing the rule, having just applied it to someone else, and
      writing the correction, did not prevent it. So the fix is NOT "be more
      careful" and NOT a checklist item — it is a WRITING RULE, mechanical
      enough to apply while tired:

        When a probe result becomes a claim, the sentence names the exact
        command AND its scope, and any word that generalises beyond the run
        ("the day X happens", "the boundary", "the class") must either be
        deleted or be backed by a SECOND measured point in a different
        direction.

      Instance 5 would have been caught by that rule in the act of typing:
      "the day FU-1 is fixed, K3III.DNG goes red" generalises from one
      simulated future to all of them, and the reviewer found the second point
      (FU-1 as actually specified) in a single mutation. Instance 3 and
      instance 4 would have been caught the same way.
      CODIFY AT STAGE-001's CLOSE, which is now imminent — with the rule above,
      quoted, into AGENTS.md §16 (Confidence Discipline) next to "measured
      once, on one file is not 1.0".

      Distinct from [[unrun-docs-carry-errors]] and sharper: those docs were never
      executed. This one WAS executed, and was still wrong, because the conclusion
      was broader than the experiment. AT BAR (N=3) as of 2026-08-21 — codify at
      the owning stage's close. The rule that would have caught all three: when a
      probe result becomes a claim, state the exact command AND its scope beside
      it ("mutated RowsPerStrip" is not "the boundary is mutation-tested"). The
      third instance is the worst: the whole point was to check a BOUNDARY, and one
      point on a boundary is never a boundary.

  # --- process-debt: two owners for one field ---------------------------------
  - id: cost-field-has-two-owners
    type: process-debt
    summary: "AGENTS.md §15 tells the agent to write cost.sessions; DEC-013 says handback-sync transcribes it."
    evidence: "N=2. (1) SPEC-006 F-5 — cost.sessions was empty after verify because each side could assume the other had it. (2) SPEC-007/FU-7 — HANDOFF-017's whole `handback:` block was null while handoff.status was `completed`; the number survived only because the build wrote cost.sessions directly, i.e. the same ambiguity firing from the OTHER side."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-18
    last_touched: 2026-08-21
    raised_by: claude
    notes: |
      Both cannot be authoritative. `handback-sync` is the better owner (it is
      idempotent, it stamps synced_at, and it cannot fat-finger a number), so
      AGENTS.md §15 should say "fill the handback; the orchestrator syncs" rather
      than "append a cost session". Template-level: fix upstream, not just here.

      ⚠ MEASURED 2026-08-21 while reconciling SPEC-007/FU-7, and it narrows the
      fix: `just handback-sync SPEC-NNN` EXITS 1 with "Spec not found" once the
      spec is archived to specs/done/. So the double-append hazard SPEC-003's
      build measured is only live BEFORE ship, and after ship the handback
      front-matter can never be reconciled by the tool at all — it has to be
      hand-corrected, as HANDOFF-017's was. HANDOFF-015/016/019/020 all still
      read `synced_at: null` with hand-written sessions in their specs; harmless
      now for the same reason, but it means the tool has never actually run on
      SPEC-004, SPEC-007 or SPEC-008.

  # --- process-debt: a ship step with no surface skipped six times --------------
  - id: brag-step-skipped-at-ship
    type: process-debt
    summary: "The ship cycle's accomplishment-logging step was skipped on every shipped artifact until a human asked."
    evidence: "SPIKE-001, SPIKE-002, SPEC-001, SPEC-002, SPEC-003, SPEC-006 all shipped with cost.totals, reflections and archive done, and zero brag entries. brag_list for this project returned [] after six ships."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-21
    last_touched: 2026-08-21
    raised_by: human
    notes: |
      DEC-010 makes it on-by-default and AGENTS.md §15 lists it, but nothing
      SURFACES its absence: `just status`, `just validate` and `just cost-audit`
      are all silent, and archive-spec succeeds regardless. It is the "ship the
      reader with the field" defect (AGENTS.md §11) applied to a process step —
      an unperformed step looks exactly like a step whose turn has not come.
      Cheap fix: have `just status` count shipped specs against brag entries for
      the project and show the gap, or have archive-spec refuse without one.
      Backfilled 2026-08-21 (entries 384-390), so the record is now complete —
      but it took a human noticing, which is the whole point.

  # --- process-debt: a named-test spec can pass vacuously -----------------------
  - id: named-tests-can-pass-vacuously
    type: process-debt
    summary: "`cargo test <name>` matching ZERO tests exits 0, so a spec that names its failing tests can be satisfied by tests that do not exist."
    evidence: "SPEC-004 build + verify, both reproduced. Two of the five named tests also pass vacuously on a runner without the corpus."
    bar: null
    status: accepted
    disposition_at: project-close
    first_flagged: 2026-08-21
    last_touched: 2026-08-21
    raised_by: claude
    notes: |
      ACCEPTED AS A CHECK, not a signal -- the reviewer's argument is that a signal
      alone repeats [[brag-step-skipped-at-ship]], where a documented step with no
      surface simply did not happen. Two traps for whoever writes it, both measured
      on SPEC-004: it must SUM ACROSS TARGETS (the orchestrator read only the first
      target and saw "0 passed" for four of five; the reviewer's tail -40 cut the
      lib target off the top -- the same error in opposite directions on one day),
      and it must run WITH the corpus.

  # --- golden-path: capture freely, promote almost never ----------------------
  - id: findings-carry-ids-across-boundaries
    type: golden-path
    summary: "Labelling every review finding ship-blocking or follow-up, and giving follow-ups a per-spec id, lets a finding survive a handoff boundary."
    evidence: "SPEC-003/FU-11 crossed four artifacts and three sessions: raised at verify, carried into the next build brief, deferred with a stated reason, re-raised at the following verify, and became SPEC-007's Context. N=1."
    bar: "N=3"
    status: watch
    disposition_at: project-close
    first_flagged: 2026-08-21
    last_touched: 2026-08-21
    raised_by: human
    notes: |
      Codified in AGENTS.md §15 on 2026-08-21 as SB-N / FU-N, numbered PER SPEC.
      NOT in the template -- invented by SPEC-003's verify session, adopted without
      question, and it reached a decision record and a framed spec before anyone
      asked what it meant.
      TWO PARTS, WORTH SEPARATING WHEN JUDGING IT. The ship-blocking/follow-up SPLIT
      is what stopped SPEC-001's gate loop -- three reviewers found real defects and
      still approved. The ID is narrower: it earns its place only when a finding
      CROSSES a boundary (deferred, re-raised, handed to another spec), which is
      roughly a third of what we have numbered. IDs for findings that die in the
      same document are ceremony.
      Maintainer's stated intent (2026-08-21): this is effectively a bug/task list
      and will eventually move to a real tool; the repo convention is the interim.

      RECONCILED 2026-08-21, and the count is now measured rather than estimated:
      34 findings across SPEC-003 (FU-1..15), SPEC-004 (FU-16..21, which continued
      the sequence rather than restarting), SPEC-007 (FU-1..7) and SPEC-008
      (FU-1..6). 26 already had a findable disposition and 8 had none — four of
      those because SPEC-008's reflection said "yes, one spec" and no spec was
      created. Final tally after the walk: 25 `fixed`, 3 `closed`, 2 `signal`,
      4 → SPEC-009. That ratio is the honest verdict on the convention: the
      ID did NOT lose findings, but only the ones an orchestrator happened to act
      on got acted on. The half that was missing was never the id; it was a
      DISPOSITION POINT. AGENTS.md §15 now names one (the raising spec's ship) and
      four dispositions, with [[follow-up-disposition-has-no-surface]] carrying the
      check that would make it stick. Re-judge at project close with that in place:
      the split (ship-blocking vs follow-up) is proven; the id plus a bounded
      lifetime is the part that is new as of today and unproven.
      DISPOSITION AT PROJECT CLOSE: if it is still carrying its weight, write it up
      for the spec-driven-template repo -- the template has no follow-up convention
      at all, and every instance will reinvent one. Promote only on evidence; a
      wrong paved road is worse than none.

  # --- process-debt: to_agent is a prediction read as a measurement ------------
  - id: tier-map-predicts-what-it-should-record
    type: process-debt
    summary: "tier_map stamps a PREDICTED model into handoff.to_agent, which handback-sync copies into a field downstream reads as measured fact."
    evidence: "SPEC-007/FU-6. 1 for 4 (three misses, one hit): SPEC-001's build ran on opus against a map saying sonnet; SPEC-007's build ran on sonnet against a map saying opus; SPEC-005's build (2026-08-22) ran on claude-sonnet-5 against a map saying claude-opus-5, and this time NO implementer noticed — the orchestrator caught it only by reading message.model. SPEC-005's VERIFY is the first HIT: tier_map.verify said claude-opus-5 and 139/139 usage objects read claude-opus-5, confirmed independently by the reviewer and the orchestrator."
    bar: null
    status: accepted
    disposition_at: project-close
    first_flagged: 2026-08-21
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ⚠ THIRD INSTANCE, 2026-08-22 (SPEC-005 build), and it is the worst of the
      three because the previous safeguard FAILED. Both earlier times an
      implementer noticed and said so; this time the build session never filled
      the handback at all, so nothing corrected to_agent and the orchestrator
      nearly transcribed the prediction as fact. It was caught only by reading
      `message.model` in the build's own transcript (215/215 claude-sonnet-5).
      COST CONSEQUENCE, measured on that session: 30,114,705 deduped tokens at
      98.2% cache-read computes $13.55 at published Sonnet rates, $67.74 at Opus
      rates — 5.0x — and $198.76 at the repo's flat rate_per_mtok 6.60 — 14.7x.
      So the two open cost signals COMPOUND here: a wrong model in to_agent
      multiplies a figure the flat rate already inflates. Any fix that leaves
      to_agent writable by a prediction leaves that product in place.
      The narrow lesson worth carrying even before the fix lands: `message.model`
      in the session transcript is an ACTUAL record and is cheap to read. Whoever
      writes a cost session should read it rather than trusting any map.

      ⚠ CORRECTED SAME DAY by SPEC-005's reviewer, and the correction sharpens
      the signal rather than softening it: this is 1 for 4, not 0 for 4 — the
      verify cycle's prediction was RIGHT. A field that is wrong every time gets
      distrusted and checked; a field that is right three times in four gets
      trusted and then is wrong on the fourth. The hit is the argument FOR the
      fix, not against it.

      ⚠ SECOND MEASUREMENT, same spec: the "FLOOR, captured before the session
      closes" convention every cost session here uses under-reports by a real
      margin. SPEC-005's verify recorded 8,500,000; the same transcript measured
      after the session closed gives 10,203,870 deduped over 74 distinct ids —
      the recorded figure is 17% LOW. That bias is systematic and always in the
      same direction, so it compounds with [[token-counts-not-comparable]] and
      [[flat-rate-overstates-cached-sessions]]. Recorded, not retro-fixed: the
      reviewer's number is theirs to report and the convention is repo-wide.

      Half-fixed at SPEC-007's ship: .repo-context.yaml now labels tier_map a
      DISPATCH HINT and tells whoever runs a cycle to correct to_agent to what
