  # --- process-debt: IDs minted on two branches collide ----------------------
  - id: spec-ids-collide-across-unmerged-branches
    type: process-debt
    summary: "`just new-spec` mints the next ID by scanning the WORKING TREE, so an ID created while a branch is in flight silently collides with one created on that branch."
    evidence: "2026-08-22. SPEC-010 was framed during SPEC-005's ship and committed on feat/spec-005-metadata-oracle. Later the same day, on main (PR not yet merged), `just new-spec` assigned SPEC-010 AGAIN — for a different spec. Caught by hand because the collision was visible in the same session; it would not have been visible to either branch alone, and would have surfaced as a merge that produced two SPEC-010 files."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-22
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      AGENTS.md §2 is explicit that IDs are "globally unique and continuous
      across the repo" and that `just new-stage` / `just new-spec` "assign the
      next number repo-wide". They assign the next number in the CHECKOUT, which
      is the same thing only while there is exactly one branch — and this repo's
      whole model is a spec-per-branch with build and verify dispatched
      elsewhere, so in-flight branches are the NORMAL state, not the exception.
      Renamed by hand to SPEC-011 this time.
      Cheap fixes, in order of preference:
        1. Mint from `git log --all` / `git ls-tree` across refs rather than the
           worktree — sees every branch, merged or not.
        2. Have `just validate` fail on duplicate IDs, so a collision cannot
           reach main even if minting misses it. (Detection, not prevention —
           but it is the half that cannot be forgotten.)
      Template-level: this is the template's script, so fix upstream and not
      only here. Same family as [[cost-field-has-two-owners]] and
      [[tier-map-predicts-what-it-should-record]] — a value derived from an
      incomplete view, presented as authoritative.

  # --- lesson: a gate that fails MUTELY is indistinguishable from one that never ran
  - id: a-gate-that-fails-mutely-is-a-gate-that-never-ran
    type: lesson
    summary: "A zero-match grep under `set -o pipefail` aborts the script before its own error message — so a gate reports 'failed' with no reason, and nobody can tell it from a gate that never ran."
    evidence: |
      N=4, and all four are the same root shape: TEXT MATCHING ON OUTPUT, where
      the zero-match case became control flow instead of an assertion.
      (1) SPEC-001 — the orchestrator's attack hit `#[cfg(test)]` inside a DOC
          COMMENT; false negative.
      (2) SPEC-001 — the attack hit the second `#![deny(` which lives in module
          prose, deleting 14 chars of text; false negative.
      (3) SPEC-001/PL-1 — the red-proof's own prologue parser skipped `//!` but
          not `//`: a silent FALSE GREEN that shipped a panic past seven gates.
      (4) PATCH-001 — the red-proof's assertion 4 grepped for `--> src/lib.rs`
          in CLIPPY'S OWN OUTPUT, which CI colourises even when redirected:
          `\e[1m\e[94m--> \e[0msrc/lib.rs:66`. Zero match, exit 1, script dead
          before its `die`. DARK FROM THE DAY THE JOB WAS CREATED (1964a7f,
          2026-08-20) — it failed in all 17 runs of the red streak and clippy in
          only 14, so the first three reds were THIS defect alone.
    bar: "N=3 same-outcome"
    status: codified
    disposition_at: stage-close
    first_flagged: 2026-08-22
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ══ STAGE-001 CLOSE, 2026-08-22: CODIFIED at N=4. ══
      Landed in AGENTS.md §16. Codified in the same stage it was raised, which
      is unusual and deliberate: it is the only lesson here with a MEASURED
      FALSE GREEN among its instances, and its fourth instance had a
      blocking-constraint gate dark in CI for 17 consecutive runs.
      ⚠ NOT DONE, and stated so it is not mistaken for done: the sweep. The rule
      is landed and lint-red-proof.sh is clean, but the same shape was measured
      in _lib.sh, decisions-audit.sh, ready.sh, release-notes.sh, report_daily.sh
      and test.sh. Auditing those is STAGE-002 work, not a note.

      SPLIT OUT of [[floating-toolchain-plus-deny-warnings]] on 2026-08-22 after
      PATCH-001's verify (SB-2) showed that signal's evidence had the causality
      INVERTED. Conflating them would have had the project close fix the
      toolchain and leave the mute gate — and the mute gate is the one that had
      never worked.
      This is the same family as [[attribute-text-inside-doc-comments]] (N=5)
      but the OUTCOME differs and that is why it is its own entry: there, a
      match landed on the wrong text; here, a NON-match became control flow.
      Both are "assert your match count", from opposite sides.
      WELL PAST BAR at N=4 with a false green among them. Codify at stage close:
        Every grep whose result a gate DEPENDS ON is guarded (`|| true`) and its
        match count ASSERTED. A gate must never exit on a pipeline's own status;
        it exits through its own `die`, with a reason.
      ⚠ Guarding ONE grep in a pipeline is not enough and looks like it is —
      PATCH-001's first fix did exactly that and reproduced the original
      behaviour byte-for-byte, because a zero-match emits nothing and the NEXT
      grep in the pipe zero-matches too. Guard every stage.
      ⚠ And the test that "checks" this is easy to get wrong in the same
      direction: the orchestrator proposed forcing the range out of bounds,
      which makes the leading grep MATCH and exercises a different path. Only a
      genuine zero-match of the LEADING grep exposes it.

  # --- risk: -D warnings on a FLOATING toolchain breaks CI on unchanged code -
  - id: floating-toolchain-plus-deny-warnings
    type: risk
    summary: "CI runs `-D warnings` on `dtolnay/rust-toolchain@stable`, so every lint a new clippy release ADDS fails CI on code nobody touched."
    evidence: "PATCH-001, 2026-08-22, and CORRECTED by its independent verify (SB-2) — the first version of this line named the drift as root cause and was WRONG. Measured job-by-job across 22 runs: main was red for 17 CONSECUTIVE runs from 1964a7f (2026-08-20, ship(spec-001) — the first run that contained the Rust jobs) through 04aaf4b, spanning SIX shipped specs. The red-proof job failed in ALL 17; clippy in 14. THE FIRST THREE HAD CLIPPY GREEN, with the red-proof's ANSI defect the sole cause. So the toolchain drift is the LATER and SMALLER half: the gate enforcing a blocking constraint had never once run successfully in CI."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-22
    last_touched: 2026-08-22
    raised_by: claude
    notes: |
      ⚠ SCOPE OF THIS SIGNAL, narrowed by PATCH-001's verify. This risk is about
      the FLOATING-TOOLCHAIN half only, and that half accounts for 14 of the 17
      red runs. The other, older and more serious half — a red-proof that had
      never run successfully in CI, dark from the day the job was created — is
      NOT a toolchain question at all and is tracked separately as
      [[a-gate-that-fails-mutely-is-a-gate-that-never-ran]]. Do not let the
      close treat one as the other; the first version of this entry did exactly
      that, which is what SB-2 caught.

      PATCH-001 fixed the INSTANCE and added `just lint-ci` so the drift is
      visible locally. It did NOT settle the standing question, which is a real
      trade-off and wants a DEC rather than a habit:

        FLOATING + `-D warnings` catches new lints early — that is the point —
        but makes every clippy release a potential CI outage on unchanged code.
        PINNING makes CI reproducible but freezes the panic-free lint policy at
        an old clippy, which is the thing the policy exists to keep sharp.

      Three options for the close, in the order I would consider them:
        1. Keep floating; make `just lint-ci` a PRE-PUSH habit and accept
           periodic breakage as the cost of currency. (Status quo + the recipe.)
        2. Pin the CI toolchain and add a SCHEDULED job on floating stable that
           reports without blocking — currency without the outage.
        3. Drop the blanket `-D warnings` for an explicit deny-list, so only
           lints we chose can break the build.
      Option 2 is the one that keeps both properties; it costs one workflow.

      ⚠ WHAT MAKES THIS A RISK RATHER THAN JUST DEBT: the two jobs that were
      dark are `clippy -D warnings` and `lint policy red-proof` — the mechanical
      enforcement of the BLOCKING constraint `no-panics-on-untrusted-input`
      (DEC-009). constraints.yaml says "do not delete either job without
      replacing its guarantee." A job red for four specs is deleted in effect,
      and a red for an UNRELATED reason is worse than a red badge: a genuine
      failure becomes indistinguishable from the noise. Whatever the close
      decides, that property is the one to protect.

      Compounds [[unrun-docs-carry-errors]] from the other direction: here the
      docs were right (SPEC-006's handback flagged the 1.97->1.98 drift on
      2026-08-18) and nobody acted, because a note in a handback has no forcing
      function. That is the same gap [[follow-up-disposition-has-no-surface]]
      exists to close, arriving from a third direction.

  # --- process-debt: the flat rate is wrong by 2.7x on cache-heavy sessions ----
  - id: flat-rate-overstates-cached-sessions
    type: process-debt
    summary: "rate_per_mtok: 6.60 applied flat computes 2.7x the true cost on a 97.5%-cache-read session."
    evidence: "N=3, three sessions and two models, always the same direction. (1) SPEC-007 verify: $19.35 per-component at published Opus rates vs $51.06 flat — 2.6x. (2) PATCH-001, SPEC-005's build on claude-sonnet-5: $13.55 actual vs $198.76 flat — 14.7x, because the flat rate ALSO ignores which model ran. (3) SPEC-010 verify: $21.33 vs $68.39 — 3.2x. Every session in this project is 93-98% cache-read, so the flat figure is wrong for all of them."
    bar: null
    status: open
    disposition_at: project-close
    first_flagged: 2026-08-21
    last_touched: 2026-09-03
    raised_by: claude
    notes: |
      ⚠ THIRD MEASUREMENT 2026-09-03 (SPEC-010/FU-4), and the spread across the
      three is the argument: 2.6x, 3.2x — and 14.7x on the one session that ran
      on a DIFFERENT MODEL than the flat rate assumes. So the error is not a
      constant a correction factor could absorb; it is the product of two
      independent wrongnesses, cache composition and model, and it compounds
      with [[tier-map-predicts-what-it-should-record]] because that is the field
      that says which model. Any close that fixes one and not the other leaves
      a figure nobody should use.

      Compounds [[token-counts-not-comparable]]: the token counts are already
      basis-dependent, and estimated_usd then multiplies them by a rate that
      ignores cache tiers entirely. AGENTS.md §4 does say the estimate is
      order-of-magnitude and cache-discount-free -- so this is documented, not
      hidden -- but "documented as wrong" and "useful" are different things.
      Options at close: record the four component counts per session and compute,
      or drop estimated_usd rather than carry a number nobody should use.
