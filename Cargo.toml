[package]
name = "irradiance"
version = "0.2.1"
edition = "2021"
# Measured, not guessed — see guidance/toolchain-brief.md and
# projects/PROJ-001-monochrome-dng-develop/specs/SPEC-001-*.md. 1.90.0 is the
# oldest toolchain installed on the machine that measured this; the true floor
# is lower but unmeasured. Do not lower this without compiling against an
# actually-older toolchain.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A permissively-licensed, pure-Rust library that reads camera RAW files and develops them into images."
repository = "https://github.com/jysf/irradiance"
# Published 0.1.0, honestly scoped (monochrome, uncompressed DNG, one camera) —
# DEC-028 reverses STAGE-004's "wait for a second camera" publish-wait. An
# optional path dependency still needs a registry version at publish time, so a
# bare path dep makes the consuming crate (crustyimg) unpublishable.
keywords = ["raw", "dng", "camera", "image", "photography"]
categories = ["multimedia::images"]
# Strict allow-list: ship only what the crate needs to build and be understood.
# Without it the package swept in the whole ContextCore spec system (decisions/,
# projects/, docs/, scripts/, …) — 364 files. `include` is an allow-list, so
# new process directories can never leak into a future release. `src/**/*.rs`
# covers the library and the `irr` bin (no non-.rs asset is read at build time);
# the dual licence is listed explicitly because `license = "…"` does not pull
# the LICENSE files in on its own.
include = [
    "src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "irradiance"
path = "src/lib.rs"

# `irr` is an internal dev/oracle binary, never a shipped product surface
# (constraint `library-not-application`). It is deliberately absent from the
# library's public API.
#
# Gated behind the empty `irr` feature (SPEC-055, DEC-048): a target whose
# required-features are not enabled is not built, so a default `cargo build`,
# `cargo install irradiance` and `cargo package` produce no `irr` executable.
# `just test` / CI run `cargo test --all-features`, which enables it, so
# `env!("CARGO_BIN_EXE_irr")` in tests/demosaic_oracle.rs still resolves. Build
# it by hand with `cargo build --release --features irr`. The source still
# ships under `include` (harmless, and it keeps the published manifest
# self-consistent — an excluded bin path would break `cargo install`).
# scripts/package-targets-check.sh fails CI if the default build regains it.
[[bin]]
name = "irr"
path = "src/bin/irr.rs"
required-features = ["irr"]

# Dev-only exposure, NOT a runtime dependency (DEC-036). An empty feature that,
# when enabled, compiles in the doc-hidden `__fuzz_ljpeg` entry (src/lib.rs) so
# the separate `irradiance-fuzz` crate can drive the otherwise `pub(crate)`
# SOF-3 decoder. The published crate (default features) leaves it off, so the
# decoder stays fully internal until STAGE-010 decides the real public surface.
# Carries no dependency, so `no-new-top-level-deps-without-decision` holds (the
# `[dependencies]` table below is still empty). SPEC-038.
[features]
fuzzing = []
# Dev-only, same shape as `fuzzing`: an empty feature with no dependency and no
# library code behind it. Its only effect is to enable the internal `irr` bin
# above (`required-features`). SPEC-055, DEC-048.
irr = []
# Dev-only, NOT a runtime dependency (SPEC-054, DEC-049; same shape as `fuzzing`
# above). An empty feature that compiles in the doc-hidden `test_fixture`
# constructors on `Sensor` (SPEC-054) and on `Cfa` and `WarpRect` (SPEC-042,
# DEC-052). Those types are `#[non_exhaustive]` (sealed parser-output views), so
# the separate `tests/` crate cannot write a struct literal for them; its
# fixtures start from these constructors instead. The self dev-dependency below
# turns it on for every test/example build, so a bare `cargo test` compiles; the
# published crate (default features) leaves it off and gains no construction
# path. Carries no dependency.
test-fixtures = []

# Zero dependencies by design (SPIKE-001; this spec's handoff). Adding one
# needs a DEC — see guidance/constraints.yaml `no-new-top-level-deps-without-decision`.
[dependencies]

[dev-dependencies]
# DEV-ONLY self dependency (SPEC-042, DEC-052 §3; the group-C verify follow-up
# DEC-050 recorded). It enables the dev-only `test-fixtures` and `irr` features
# for every test, example and bench build, so a bare `cargo test` (no
# `--all-features`) compiles the integration tests — they build the sealed
# `Sensor`/`Cfa`/`WarpRect` from `test_fixture()` and run the `irr` bin. A
# path-only dev-dependency is stripped from the published manifest by
# `cargo package`, so the released crate is unaffected; it adds no crate to the
# graph (it is this crate), so "zero dependencies" and DEC-010 still hold.
irradiance = { path = ".", features = ["test-fixtures", "irr"] }

# DEV-ONLY, and that is load-bearing: `toml` parses tests/corpus/manifest.toml
# for the corpus tests and the `corpus-status` example. It is never compiled
# into the library, so "irradiance has no dependencies" stays true as written
# — `[dependencies]` above is still empty. See DEC-010.
#
# Feature set is MEASURED (SPEC-002 design), not guessed:
#   toml = "0.8"                                 -> 12 crates, parses
#   default-features = false, features=["parse"] -> 11 crates, parses   <- this
#   default-features = false                     ->  6 crates, does NOT parse
#     (`Value: FromStr` unsatisfied — it passes `cargo check` only because
#      nothing calls the API, a shape-check masquerading as a behaviour-check)
toml = { version = "0.8", default-features = false, features = ["parse"] }

# DEV-ONLY, and that is load-bearing: scores the develop-layer oracle's
# synthetic tier-A fixtures and dnglab's `--srgb` output with SSIMULACRA2
# (SPEC-020). Never compiled into the library, so `[dependencies]` above stays
# empty. `ssimulacra2` itself is BSD-2-Clause (design-time expectation was
# BSD-3-Clause OR MIT — corrected by measurement, still permissive); its full
# resolved graph is MIT/Apache-2.0/BSD-2-Clause/Unicode-3.0 only, confirmed by
# `cargo deny check licenses` in a probe workspace. See DEC-023.
ssimulacra2 = "0.5.1"
