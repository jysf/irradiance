[package]
name = "irradiance"
version = "0.1.1"
edition = "2021"
# Measured, not guessed — see guidance/toolchain-brief.md and
# projects/PROJ-001-monochrome-dng-develop/specs/SPEC-001-*.md. 1.90.0 is the
# oldest toolchain installed on the machine that measured this; the true floor
# is lower but unmeasured. Do not lower this without compiling against an
# actually-older toolchain.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A permissively-licensed, pure-Rust library that reads camera RAW files and develops them into images."
repository = "https://github.com/jysf/irradiance"
# Published 0.1.0, honestly scoped (monochrome, uncompressed DNG, one camera) —
# DEC-028 reverses STAGE-004's "wait for a second camera" publish-wait. An
# optional path dependency still needs a registry version at publish time, so a
# bare path dep makes the consuming crate (crustyimg) unpublishable.
keywords = ["raw", "dng", "camera", "image", "photography"]
categories = ["multimedia::images"]
# Strict allow-list: ship only what the crate needs to build and be understood.
# Without it the package swept in the whole ContextCore spec system (decisions/,
# projects/, docs/, scripts/, …) — 364 files. `include` is an allow-list, so
# new process directories can never leak into a future release. `src/**/*.rs`
# covers the library and the `irr` bin (no non-.rs asset is read at build time);
# the dual licence is listed explicitly because `license = "…"` does not pull
# the LICENSE files in on its own.
include = [
    "src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "irradiance"
path = "src/lib.rs"

# `irr` is an internal dev/oracle binary, never a shipped product surface
# (constraint `library-not-application`). It is deliberately absent from the
# library's public API.
[[bin]]
name = "irr"
path = "src/bin/irr.rs"

# Zero dependencies by design (SPIKE-001; this spec's handoff). Adding one
# needs a DEC — see guidance/constraints.yaml `no-new-top-level-deps-without-decision`.
[dependencies]

[dev-dependencies]
# DEV-ONLY, and that is load-bearing: `toml` parses tests/corpus/manifest.toml
# for the corpus tests and the `corpus-status` example. It is never compiled
# into the library, so "irradiance has no dependencies" stays true as written
# — `[dependencies]` above is still empty. See DEC-010.
#
# Feature set is MEASURED (SPEC-002 design), not guessed:
#   toml = "0.8"                                 -> 12 crates, parses
#   default-features = false, features=["parse"] -> 11 crates, parses   <- this
#   default-features = false                     ->  6 crates, does NOT parse
#     (`Value: FromStr` unsatisfied — it passes `cargo check` only because
#      nothing calls the API, a shape-check masquerading as a behaviour-check)
toml = { version = "0.8", default-features = false, features = ["parse"] }

# DEV-ONLY, and that is load-bearing: scores the develop-layer oracle's
# synthetic tier-A fixtures and dnglab's `--srgb` output with SSIMULACRA2
# (SPEC-020). Never compiled into the library, so `[dependencies]` above stays
# empty. `ssimulacra2` itself is BSD-2-Clause (design-time expectation was
# BSD-3-Clause OR MIT — corrected by measurement, still permissive); its full
# resolved graph is MIT/Apache-2.0/BSD-2-Clause/Unicode-3.0 only, confirmed by
# `cargo deny check licenses` in a probe workspace. See DEC-023.
ssimulacra2 = "0.5.1"
