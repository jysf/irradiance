name: CI

# Language-agnostic spec-driven gates (cost-data, decisions-index) plus this
# repo's Rust jobs, added by SPEC-001. The panic-free lint policy
# (`no-panics-on-untrusted-input`) is enforced mechanically here, not by
# review — see AGENTS.md §12 and guidance/constraints.yaml.
#
# ⚠ Per DEC-003, CI cannot run tier-B (real-camera) tests — the corpus lives
# outside the repo and is never committed. Nothing below implies the decoder
# is bit-exact; that claim is scoped to `docs/conformance-matrix.md`, not to
# a green badge here.
on:
  push:
  pull_request:

jobs:
  cost-data:
    name: cost-capture audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cost-audit (shipped specs have build/verify cost; AGENTS §4)
        run: ./scripts/cost-audit.sh

      # PATCH-002. The gate above now also fails when a SHIPPED STAGE has an
      # empty orchestration_cost. `constraints.yaml` says a job that exists and
      # has never passed is a deleted job; the sibling case is a gate that has
      # never FAILED, which cannot be told from one that never ran. So the
      # red-proof runs in CI beside the gate it proves.
      - name: cost-audit goes red on an unfilled stage orchestration_cost
        run: ./scripts/cost-audit-red-proof.sh

      # Opt-in by existence: passes quietly until you run `just decisions-index`
      # once and commit the result. After that it fails if the index falls
      # behind the decisions — the difference between a derived artifact and a
      # decorative one.
      - name: decisions-index is not stale
        run: ./scripts/decisions-index.sh --check

  fmt:
    name: rust / fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: rust / clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: rust / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Mirrors `just test` (app.just). Tier B is ABSENT on a CI runner by
      # construction (DEC-003 — RAW files are never committed), so every
      # corpus test skips here. This step is what puts that in the CI log:
      # `eprintln!` inside a passing test is captured, so a skip announced
      # from inside the harness leaves CI looking uniformly green for work it
      # never did. Keep this ahead of `cargo test`, and do NOT replace it by
      # adding `--nocapture` below (SPEC-002).
      - run: cargo run --quiet --all-features --example corpus-status
      - run: cargo test --all-features

  licenses:
    name: rust / license policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # SPEC-003 punch-list round. This repo has TWO cargo graphs: the library at the
  # root, and `irradiance-fuzz` under fuzz/ (DEC-011), which is deliberately kept
  # out of the library's graph so `[dependencies]` stays empty. cargo-deny
  # evaluates ONE manifest's graph per invocation, so the job above does not see
  # a single one of libfuzzer-sys's dependencies — this job is not redundant with
  # it, and neither is a substitute for the other.
  #
  # DEC-011 originally recorded this graph as a corner cargo-deny could not reach
  # and hand-wrote its licence table instead. SPEC-003's verify cycle ran the
  # command: it works, and it FAILED, on two real defects the hand-check had
  # missed — libfuzzer-sys declares `(MIT OR Apache-2.0) AND NCSA` (conjunctive;
  # NCSA now carries a named per-crate exception in deny.toml) and
  # `irradiance-fuzz` had no `license` field at all, which is `unlicensed` and an
  # error. The gate was never absent. It was never invoked, for the length of a
  # whole build cycle, while a document stood in for it on a `blocking`
  # constraint. `--manifest-path` was the entire fix.
  #
  # Mirrors `just deny-fuzz` (app.just). Uses the same policy file as the job
  # above — deny.toml governs both graphs.
  licenses-fuzz:
    name: rust / license policy — fuzz graph (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check licenses

  msrv:
    name: rust / MSRV (1.90.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-version = "1.90" in Cargo.toml is only meaningful if CI compiles
      # against EXACTLY that toolchain (SPEC-001 acceptance criterion 2).
      # Measured, not guessed — see guidance/toolchain-brief.md. Do not swap
      # this for `stable` and do not bump the pin without re-measuring on an
      # actually-older toolchain first.
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --all-targets --all-features

  lint-policy-red-proof:
    name: rust / lint policy red-proof (must fail red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Constraint `oracle-must-be-shown-red` applied to a gate rather than an
      # oracle (SPEC-001 acceptance criterion 5), mechanism per DEC-009 (which
      # supersedes DEC-007): the script copies the crate to a temp dir and runs
      # the SAME clippy invocation on it twice — once UNMUTATED, which must
      # exit 0, and once with one violation per policy lint injected into the
      # COPIED src/lib.rs, which must exit non-zero.
      #
      # The unmutated run is a NEGATIVE CONTROL and it is the load-bearing
      # assertion. Without it, a red proves only "clippy failed", not "the
      # policy rejected the injection" — round 2 of this spec measured a false
      # green where a mis-landed injection made clippy fail with every expected
      # lint NAME in the log and not one lint firing, because rustc renders the
      # #![deny(...)] source span in any diagnostic that points at it. With the
      # control clean, a red is attributable to the injection by construction.
      #
      # It further asserts: clippy was actually available; all five policy
      # lints fired (matched on clippy's index.html#<lint> help line, emitted
      # only when a lint FIRES, never by a rendered span); the diagnostics are
      # located inside the injected line range; and the injection is still
      # rejected WITHOUT this workflow's blanket `-D warnings`, which is what
      # pins the policy at `deny` rather than `warn`.
      #
      # Delete the policy in src/lib.rs, weaken it to allow, downgrade it to
      # warn, or drop one lint from it, and this job goes red; that is the
      # entire point. A lint policy that has never rejected anything is not a
      # policy.
      - run: ./scripts/lint-red-proof.sh

  lint-policy-no-allow:
    name: "rust / panic-free policy — no #[allow] escape (--lib)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # SPEC-006. The job above (`lint-policy-red-proof`, DEC-009) pins the
      # crate-root #![deny(...)] policy by mutation test. It structurally
      # cannot see an #[allow] BENEATH that root: no #![deny] mutation can
      # observe an attribute that overrules it further down. Measured on the
      # shipped crate — one attribute on a pub fn shipped two panics on the
      # public API past seven green gates:
      #
      #   #[allow(clippy::panic, clippy::expect_used)]
      #   pub fn boom(v: &[u8]) -> u8 { if v.is_empty() { panic!("e") } *v.first().expect("x") }
      #
      # `-F` is `--forbid`: a forbidden lint cannot be re-allowed in source,
      # and attempting it is compiler error E0453 — not a clippy warning that
      # some later attribute can silence. So this fires on the ESCAPE HATCH
      # itself, whether or not the code beneath it actually panics. Measured:
      # planted attribute -> exit 101 with two E0453s; honest tree -> exit 0.
      #
      # It does NO text matching, and that is most of why it was chosen:
      # src/lib.rs carries attribute text inside its own module docs, and five
      # separate grep-shaped attempts on SPEC-001 each produced a wrong ANSWER
      # rather than an error (signal `attribute-text-inside-doc-comments`).
      # `--force-warn` is the other near-miss: it does override #[allow], but
      # `-D warnings` cannot promote a force-warn diagnostic to an error, so
      # the exit code stays 0.
      #
      # Scope is `--lib` deliberately, and the claim is scoped to it: --lib
      # excludes #[cfg(test)] modules (not compiled without cfg(test)) and
      # src/bin/irr.rs (a different target), so the sanctioned exceptions pass
      # untouched with no per-site special-casing. Running this with
      # --all-targets exits 101 on the honest tree, because the test module
      # legitimately allows all five lints.
      #
      # CI runs the cargo invocation directly rather than `just lint-no-allow`
      # — `just` is not on the runner, and every other job here inlines its
      # command the same way. `app.just` mirrors it (AGENTS.md §6).
      - run: |
          cargo clippy --lib --quiet -- \
            -F clippy::unwrap_used -F clippy::expect_used -F clippy::indexing_slicing \
            -F clippy::panic -F clippy::arithmetic_side_effects
