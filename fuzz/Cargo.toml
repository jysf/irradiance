[package]
name = "irradiance-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# Matches the library's own licence. Not decoration: a package with no `license`
# field is `unlicensed` to cargo-deny, which is an ERROR, not a warning — so
# without this line `just deny-fuzz` fails on this crate before it ever gets to
# libfuzzer-sys. Found by SPEC-003's verify cycle (HANDOFF-012, SB-1), which is
# also when the fuzz graph first got a real gate over it. See DEC-011.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.irradiance]
path = ".."

[[bin]]
name = "ifd"
path = "fuzz_targets/ifd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plane"
path = "fuzz_targets/plane.rs"
test = false
doc = false
bench = false

[[bin]]
name = "develop"
path = "fuzz_targets/develop.rs"
test = false
doc = false
bench = false
